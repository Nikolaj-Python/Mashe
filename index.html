<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d071c">
<title>Для Машуль ❤️</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d071c}
canvas{display:block;width:100vw;height:100dvh}
.hint{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font:11px Arial,sans-serif;color:#cbbcff;opacity:.7;white-space:nowrap;pointer-events:none}
</style>
</head>
<body>
<canvas id="scene"></canvas><div class="hint">Для Машуль ❤️</div>
<script>
(() => {
"use strict";
const canvas=document.getElementById("scene"),ctx=canvas.getContext("2d");
const hint=document.querySelector(".hint");
const poem=[
"Машуль, среди тысяч лиц я встретил тебя,",
"И мир заиграл непривычными красками.",
"Ты стала той, к кому тянется душа,",
"С кем даже молчание кажется ласковым.",
"",
"Ты умеешь прогнать мою усталость улыбкой,",
"Превратить обычный день в особенный миг.",
"И встреча с тобой, пусть совсем ненадолго,",
"Остаётся во мне, словно самый тёплый свет.",
"",
"Мне дорого всё, что связано с тобою:",
"Твой голос, улыбка, сияние глаз.",
"И даже когда мы на время не рядом,",
"Я мысленно снова встречаюсь с тобой.",
"",
"Моя Зая, тебе не нужно быть идеальной,",
"Чтоб быть для меня совершенно родной.",
"Ты просто будь собой — настоящей, любимой,",
"А я буду счастлив идти рядом с тобой."
];
const introMs=3800,charMs=95,pauseMs=600,slow=new Set([14,15,16,17]);
let w=0,h=0,dpr=1,start=performance.now(),last=0,stars=[],hearts=[];
function resize(){
 dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;
 canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 stars=Array.from({length:Math.max(45,Math.min(100,Math.round(w*h/9000)))},()=>({x:Math.random()*w,y:Math.random()*h,r:.5+Math.random()*1.5,p:Math.random()*6.28}));
 hearts=Array.from({length:25},()=>({x:Math.random()*w,y:Math.random()*h,s:5+Math.random()*7,v:18+Math.random()*34,p:Math.random()*6.28}));
}
function rainbow(t,o=0){return `hsl(${(t*.035+o)%360} 78% 72%)`;}
function heart(x,y,s,c){
 ctx.save();ctx.translate(x,y);ctx.scale(s/18,s/18);ctx.beginPath();
 ctx.moveTo(0,6);ctx.bezierCurveTo(-16,-4,-9,-14,0,-7);ctx.bezierCurveTo(9,-14,16,-4,0,6);
 ctx.closePath();ctx.strokeStyle=c;ctx.lineWidth=1.5;ctx.shadowColor=c;ctx.shadowBlur=5;ctx.stroke();ctx.restore();
}
function background(t,dt){
 const g=ctx.createRadialGradient(w*.5,h*.42,10,w*.5,h*.5,Math.max(w,h)*.8);
 g.addColorStop(0,"#21103d");g.addColorStop(.55,"#120a29");g.addColorStop(1,"#080511");
 ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
 for(const s of stars){let b=.35+.65*(.5+.5*Math.sin(t*.0015+s.p));ctx.globalAlpha=b;ctx.fillStyle=b>.78?"#fff":"#b9a3ff";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}
 ctx.globalAlpha=1;
 for(const p of hearts){p.y+=p.v*dt/1000;p.x+=Math.sin(t*.001+p.p)*.35;if(p.y>h+20){p.y=-20;p.x=Math.random()*w;}heart(p.x,p.y,p.s,rainbow(t,p.p*40));}
}
function fontSize(){return w<380?Math.max(13,Math.min(16,w*.041)):w<700?16:Math.min(23,Math.max(17,w/48));}
function wrap(text,maxWidth,font){ctx.font=font;const words=text.split(" "),out=[];let line="";
 for(const word of words){const test=line?line+" "+word:word;if(ctx.measureText(test).width>maxWidth&&line){out.push(line);line=word;}else line=test;}
 if(line)out.push(line);return out;}
function rainbowText(text,y,fs,t,offset=0){
 ctx.font=`500 ${fs}px Arial,Helvetica,sans-serif`;ctx.textBaseline="middle";ctx.textAlign="left";
 const chars=Array.from(text),widths=chars.map(c=>ctx.measureText(c).width),gap=fs*.015;
 let x=(w-(widths.reduce((a,b)=>a+b,0)+gap*Math.max(0,chars.length-1)))/2;
 chars.forEach((c,i)=>{ctx.fillStyle=rainbow(t,offset+i*9);ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=7;ctx.fillText(c,x,y);x+=widths[i]+gap;});
 ctx.shadowBlur=0;
}
function intro(t){
 const pulse=.8+.2*Math.sin(t*.003);
 rainbowText("Маша...",h*.40,Math.min(35,w*.085),t);
 rainbowText("этот стих я посвящаю тебе",h*.48,Math.min(20,w*.047),t,90);
 ctx.font=`${Math.round(34*pulse)}px Arial`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle=rainbow(t,180);ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=18;ctx.fillText("❤",w/2,h*.57);ctx.shadowBlur=0;
}
function drawPoem(elapsed,t){
 const fs=fontSize(),maxWidth=Math.min(w-28,980),lh=fs*1.7,font=`500 ${fs}px Arial,Helvetica,sans-serif`,items=[];
 poem.forEach((line,i)=>{if(!line){items.push({text:"",i});return;}wrap(line,maxWidth,font).forEach(part=>items.push({text:part,i}));});
 const totalHeight=items.length*lh,startY=Math.max(22,(h-totalHeight)/2+lh/2);
 let y=startY;
 for(const item of items){
  if(y>h-12)break;
  if(item.text){
   let offset=0;
   for(let i=0;i<item.i;i++)offset+=poem[i].length;
   // Add elapsed typing duration and pause for all previous lines.
   let elapsedBefore=0;
   for(let i=0;i<item.i;i++)elapsedBefore+=poem[i].length*charMs*(slow.has(i)?1.65:1)+pauseMs;
   const local=Math.max(0,elapsed-elapsedBefore);
   const count=Math.floor(local/(charMs*(slow.has(item.i)?1.65:1)));
   let visible=item.text.slice(0,Math.max(0,Math.min(item.text.length,count-(item.start||0))));
   // Wrapped segments are revealed in order.
   const segments=wrap(poem[item.i],maxWidth,font);
   let before=0;for(const seg of segments){if(seg===item.text)break;before+=seg.length;}
   visible=item.text.slice(0,Math.max(0,Math.min(item.text.length,count-before)));
   if(visible)rainbowText(visible,y,fs,t,item.i*23);
  }
  y+=lh;
 }
}
function animate(now){
 const dt=last?Math.min(40,now-last):16;last=now;background(now,dt);
 const elapsed=now-start;
 if(elapsed<introMs)intro(now);else drawPoem(elapsed-introMs,now);
 requestAnimationFrame(animate);
}
canvas.addEventListener("click",()=>{hint.style.display="none";});
addEventListener("resize",resize);addEventListener("orientationchange",resize);
resize();requestAnimationFrame(animate);
})();
</script>
</body>
</html>
